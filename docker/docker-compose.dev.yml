version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: itam_owner
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: itam
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    depends_on: [postgres, redis]
    ports: ["3001:3001"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: pnpm start:worker
    env_file: ../.env
    depends_on: [postgres, redis]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file: ../.env
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
