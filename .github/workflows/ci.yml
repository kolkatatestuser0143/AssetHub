name: CI

on:
  push:
    branches: [mango, agent/production-hardening]
  pull_request:
    branches: [mango]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-long-random-secret-change-me
      MONGODB_URI: mongodb://127.0.0.1:27017/itam_ci?replicaSet=rs0
      MONGODB_DB: itam_ci
      REDIS_URL: redis://127.0.0.1:6379
      IDP_CONFIG_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name assethub-mongo-ci -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in {1..60}; do
            if docker exec assethub-mongo-ci mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec assethub-mongo-ci mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})" || true
          for i in {1..60}; do
            if docker exec assethub-mongo-ci mongosh --quiet --eval "rs.status().myState" | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec assethub-mongo-ci mongosh --quiet --eval "rs.status().myState"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm build:api
      - name: Run API tests
        run: pnpm test:api -- --runInBand
      - name: Run security tests
        run: pnpm test:security
      - name: Stop MongoDB
        if: always()
        run: docker rm -f assethub-mongo-ci || true
