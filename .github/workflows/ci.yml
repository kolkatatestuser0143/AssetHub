name: CI

on:
  push:
    branches: [mango, agent/production-hardening]
  pull_request:
    branches: [mango]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-long-random-secret-change-me
      MONGODB_URI: mongodb://127.0.0.1:27017/itam_ci?replicaSet=rs0
      MONGODB_DB: itam_ci
      REDIS_URL: redis://127.0.0.1:6379
      IDP_CONFIG_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      mongodb:
        image: mongo:7
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Initialize MongoDB replica set
        shell: bash
        run: |
          MONGO_ID=$(docker ps --filter 'ancestor=mongo:7' --format '{{.ID}}' | head -n 1)
          test -n "$MONGO_ID"
          for i in {1..30}; do
            if docker exec "$MONGO_ID" mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})" >/dev/null 2>&1 || docker exec "$MONGO_ID" mongosh --quiet --eval "rs.status().ok" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker exec "$MONGO_ID" mongosh --quiet --eval "rs.status().myState === 1" | grep -q true; then
              break
            fi
            sleep 2
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:api
      - run: pnpm test:api -- --runInBand
      - run: pnpm test:security
