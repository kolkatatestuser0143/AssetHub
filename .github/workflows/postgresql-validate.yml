name: PostgreSQL validation

on:
  push:
    branches: [Postgresql]
  pull_request:
    branches: [Postgresql]

jobs:
  prisma-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/itam
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/itam
      JWT_ACCESS_SECRET: ci-test-secret-change-me
      REDIS_URL: redis://localhost:6379
      MAIL_ENABLED: "false"
      SEED_DEV_MODE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d itam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm prisma validate
      - run: pnpm prisma generate
      - run: pnpm build
